  # --- G3 rebuilt as a stress experiment, 2026-09-09 -------------------------
  # The withdrawn G3 row scored M03 over ALL flows, so a saturating flood's own
  # starvation counted as a telemetry liveness failure. These score the clause
  # itself, on the telemetry flow, with the silence-aware statistic beside the
  # literal one -- an inter-arrival maximum cannot see a robot that goes dark
  # and stays dark (docs/g3-stress-experiment-2026-09-09.md section 4).
  #
  # ON THE SELECTIONS, because `where` cannot express "this field is unset"
  # (`_values` refuses a None match by design, which is right -- a missing field
  # must not silently satisfy a filter). So:
  #   * the campaign-wide part-2 claims select on the four POSITIVE markers
  #     (`snr_db`, `telemetry_gbr`, `pause_ue`, and the arm), which admits the
  #     bucket-duration control as well: 140 rows against the graded set's 130.
  #     **Checked, not assumed: those 10 extra rows contribute ZERO silences
  #     over T_live, so every value below is identical over either set.**
  #   * the per-fleet-size claims pick an N at which no control cell exists
