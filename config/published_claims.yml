# Every published figure, with the artefact it came from and the statistic it
# is, so `scripts/verify_claims.py` can re-derive it.
#
# THE CONVENTION: a figure in a document is quotable only if it appears here.
# The rule this enforces is defects-log #22 -- a row that is never read back
# against its source can contradict it indefinitely, and one did.
#
# `statistic` must be the one the prose means. The checker reports which
# OTHER statistics would also have matched, and fails unless the declared one
# does: G8's row mixed a single seed with a 3-seed mean and each figure
# matched something, so "matches some estimator" is not a check.

# `code_state` (pre_scaling | post_scaling) is DOCUMENTATION, not something
# the checker enforces -- and that gap is the point. `verify_claims` re-derives
# a figure from an ARTEFACT ON DISK. Landing `_OBJ_SCALE` (0ea02b0) changed the
# CODE and rewrote no artefact, so every claim below kept passing while some of
# them stopped describing current behaviour: G1.M01.n10.twotier.median still
# re-derives as 90.125 from its pre-scaling file, while post-scaling code gives
# 87.78. **A green verify_claims is evidence the prose matches its source, and
# is NOT evidence the source matches the code.** That is the same "establish
# the check could have failed" decomposition this project applies elsewhere:
# name what the check reads (artefacts), name what the change touched (code),
# and note they do not intersect. Hence the field, and hence the pre/post
# column in docs/verification-2026-09-04.md's provenance table.

claims:

  # --- THE FAILING CASE, KEPT ON PURPOSE ------------------------------------
  # The pre-correction G8 row, as published in docs/phase2-results.md before
  # 2026-09-04. It is retained as a claim so this checker demonstrably FAILS
  # on the defect it was built for -- a guard whose failing case is not in its
  # own suite is a guard nobody has seen fail.
  - id: G8.M22.PRE_CORRECTION
    doc: docs/phase2-results.md (superseded row)
    text: "M22 starvation epochs: 0 on all arms at the core cell"
    artefact: sweeps/phase2/core_mfbr.json
    # HISTORICAL ON PURPOSE: this is the PRE-correction row, kept so the
    # checker demonstrably fails on the defect it was built for. Re-running
    # it would destroy the demonstration, which is the point of the claim.
    code_state: "historical: the kept pre-correction demonstration failure"
    n: 3
    horizon: 40000
    field: G8_M22_epochs_prot
    statistic: max          # "0 on all arms" is a claim about the worst row
    value: 0
    expect: fail            # the checker INVERTS the verdict for this claim:
                            # it must fail, and a pass here means the guard
                            # has stopped demonstrating its own failure mode

  # --- verification-2026-09-04, the current figures --------------------------
  - id: G8.M22.n10.reservation
    doc: docs/verification-2026-09-04.md
    text: "Reservation: M22 epochs on 7/10 seeds"
    artefact: sweeps/phase2/core_scaled.json
    code_state: current
    n: 10
    horizon: 40000
    where: {arm: Reservation}
    field: G8_M22_epochs_prot
    statistic: count_nonzero
    value: 7

  - id: G8.M09.n10.twotier
    doc: docs/verification-2026-09-04.md
    text: "TwoTier: M09 below 0.90 on 3/10 seeds"
    artefact: sweeps/phase2/core_scaled.json
    code_state: current
    n: 10
    horizon: 40000
    where: {arm: TwoTier}
    field: G8_M09_worst_prot
    statistic: count_lt
    statistic_arg: 0.90
    value: 3

  - id: G1.M01.n10.twotier.median
    doc: docs/verification-2026-09-04.md
    text: "TwoTier M01 p98 protected, median 90.12 ms"
    artefact: sweeps/phase2/core_scaled.json
    code_state: current
    n: 10
    horizon: 40000
    where: {arm: TwoTier}
    field: G1_M01_p98_prot
    statistic: median
    # 90.125 pre-scaling; 87.7845 after 0ea02b0. THIS IS THE FIGURE THE
    # staleness check was built for -- it re-derived cleanly from its old
    # artefact for a full day after the code that produced it changed.
    value: 87.7845
    tolerance: 0.001
    tolerance: 0.01

  - id: G1.M01.n10.breaches
    doc: docs/verification-2026-09-04.md
    text: "0/10 breach the 100 ms bound on every arm"
    artefact: sweeps/phase2/core_scaled.json
    code_state: current
    n: 10
    horizon: 40000
    field: G1_M01_p98_prot
    statistic: count_gt
    statistic_arg: 100.0
    value: 0

  - id: G3.M20.n10.breaches
    doc: docs/verification-2026-09-04.md
    text: "0/10 over the 500 ms bound on every arm"
    artefact: sweeps/phase2/core_scaled.json
    code_state: current
    n: 10
    horizon: 40000
    field: G3_M20_prot_ms
    statistic: count_gt
    statistic_arg: 500.0
    value: 0

  - id: G5.M05.n10.reservation
    doc: docs/verification-2026-09-04.md
    text: "Reservation fails the 0.99 completeness bar on 7/10 seeds"
    artefact: sweeps/phase2/core_scaled.json
    code_state: current
    n: 10
    horizon: 40000
    where: {arm: Reservation}
    field: G5_M05_prot
    statistic: count_lt
    statistic_arg: 0.99
    value: 7

  - id: G10.admissible.PF
    doc: docs/verification-2026-09-04.md
    text: "PF passes 10/10 seeds at N=8"
    artefact: sweeps/phase2/g5_consol_scaled.json
    code_state: current
    n: 10
    horizon: 20000
    where: {arm: PF, n_ues: 8}
    field: M08_fraction
    statistic: count_lt
    statistic_arg: 0.95
    value: 0

  # --- G11's C1 at the specified horizon, 2026-09-05 ------------------------
  # --- REMOVED 2026-09-05: G11.C1.soak.runs ---------------------------------
  # `min(n_windows) == 30` restates ARITHMETIC, not a measurement: 7,200,000
  # slots x 0.25 ms / 60 s windows IS 30, on any arm, under any scheduler.
  # The checker had already said so -- "median, mean, max, count,
  # count_nonzero also match; the claim is not estimator-discriminating on
  # this data". Removed rather than regenerated, per the triage: a figure
  # nobody needs does not justify an artefact.
  #
  # C1's REAL figure -- 0 failing windows of 900 -- is not claimed here yet,
  # because the 7.2M-slot soak that would stamp it is a 72-minute campaign
  # and re-running it solely to acquire a stamp is not justified. It gets a
  # claim the next time C1 is run for a reason of its own.
