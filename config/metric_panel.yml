# Pre-registered metric panel -- WP0, factory-sim-v2 / feat/high-fidelity-sim.
#
# Committed here BEFORE the first characterisation sweep (WP9), per the
# multiplicity-guard discipline in docs/p5g-sim-plan.md sec 5.2: the panel
# must not drift toward whatever happens to separate the two schedulers.
# Every metric below traces to a guarantee; every guarantee that can be
# sim-answered has a metric. See README.md sec 5 for the full G1-G12
# traceability table this panel implements.
#
# `status` is load-bearing, not decoration:
#   ok       -- computable now, exact, from data the driver already emits.
#   proxy    -- computable now, but from a stand-in the fidelity work will
#               replace (e.g. head-of-line age sampled per slot, standing in
#               for true per-message completion latency until WP3/WP7 give
#               the buffer/traffic model discrete per-message events).
#   pending  -- not computable at all yet. The scorecard must still emit
#               this metric's row (with status=pending and a reason), never
#               silently omit it -- an omitted row is indistinguishable from
#               "we forgot" versus "we can't yet", and the whole point of
#               pre-registration is that the panel's shape doesn't change
#               once sweeps start.
#
# `requires` names the WP (or simulator capability) that turns a proxy/
# pending metric into `ok`. Re-run scripts/regression_corpus.py --check
# after any WP lands and confirm the metrics it was supposed to unlock
# actually flipped status -- a WP that doesn't change a status it claimed
# to fix is itself a finding.
#
# `caveats` (optional, list of str) records a limitation of the *simulator
# mechanism* a metric is computed from, distinct from `status`/`requires`.
# Added by docs/wp5-plan.md Decision 6: M01/M02/M14/M15 are exact per their
# own definition (real per-message data, correctly computed) and stay
# `status: ok` -- reverting to `proxy` would be wrong, since the gap is a
# missing simulator mechanism (no HARQ yet), not a measurement
# approximation. A caveat records that gap without corrupting what
# `status` means. sim/scorecard.py::Scorecard.score() attaches every
# metric's caveats list to its MetricResult unconditionally (empty list if
# none registered), so a caveat travels with the value the same way
# M14/M03's t_live_s/survival_time_ms do -- never a bare number.

schema_version: 1

metrics:
  - id: M01
    name: flow_latency_percentiles
    definition: >
      p50 / p95 / p98 / p99 delay, per flow, worst asset. p98 is the 3GPP
      conformance statistic (TS 23.501 sec 5.7.3.4): while within GFBR,
      98% of packets shall not exceed the PDB.
    guarantees: [G1, G2]
    unit: ms
    direction: lower_better
    status: ok
    requires: null
    note: >
      WP7: true per-message completion latency (sim/messages.py::
      message_latency_percentiles_ms), over fully-delivered messages only.
      A RunRecord produced before WP7's message ledger was wired up (no
      message_count on any FlowRecord) falls back to the old head-of-line
      proxy in scorecard.py -- see that module's _has_true_latency.
    caveats:
      - >
        HARQ-blind until WP5 commits 4a/4b land (docs/wp5-plan.md): BLER is
        currently a one-shot discount applied at grant time, not a
        retransmission -- this value is exact for what the simulator
        models today, but doesn't yet reflect HARQ RTT delay or max-retx
        residual loss, so it reads optimistic relative to a system with
        real HARQ (README.md sec3/sec4).

  - id: M02
    name: pdb_violation_rate
    definition: >
      Byte-weighted fraction of traffic later than its PDB, plus bytes
      discarded on expiry.
    guarantees: [G1, G5, G12]
    unit: fraction
    direction: lower_better
    status: ok
    requires: null
    note: >
      Both components are exact: expiry-discard (bytes_dropped_pdb /
      bytes_arrived) and "delivered, but later than PDB"
      (bytes_delivered_late_pdb / bytes_arrived, WP3 -- sim/buffer.py's
      drain() tags each removed chunk's age against the flow's PDB at
      drain time).
    caveats:
      - >
        HARQ-blind until WP5 commits 4a/4b land (docs/wp5-plan.md): the
        "delivered, but later than PDB" component can't yet reflect a
        transmission that failed and needed a HARQ retry -- that delay
        doesn't exist in the simulator yet, so this rate is optimistic
        relative to a system with real HARQ (README.md sec3/sec4).

  - id: M03
    name: liveness_gap_distribution
    definition: >
      Max and count of telemetry inter-arrival gaps at the receiver, vs
      {T_live/4, T_live/2, T_live}. The false-failsafe bound: consecutive-
      loss tolerance, not average latency.
    guarantees: [G3]
    unit: ms
    direction: lower_better
    status: ok
    requires: null
    note: >
      WP7 commit 4: max/count of receiver-side inter-arrival gaps among
      fully-delivered messages, grouped by Message.role (sim/scorecard.py::
      Scorecard._m03_liveness_gap_distribution), compared against
      {T_live/4, T_live/2, T_live} (defaults.t_live_s below, itself an
      [OPEN] assumption -- README.md sec8). The T_live value used is always
      reported alongside the gap figure, never a bare number. A record
      produced before WP7 commit 4 (no completion_ts_by_role_s on any
      FlowRecord) reports status=pending, not a fallback proxy -- this
      metric has none.

  - id: M20
    name: protected_fleet_liveness_gap
    definition: >
      M03's worst-gap contest restricted to PROTECTED FLEET bearers --
      every 5QI except the GT-4.1/4.2 saturating aggressor and the per-UE
      best-effort filler. Same value shape as M03.
    guarantees: [G6]
    unit: ms
    direction: lower_better
    status: ok
    requires: null
    note: >
      WP9 Step 2. Added because G6 was bound to M03, whose domain is
      deliberately EVERY flow ("computed generically over any flow's
      completions", M03's own note). G6 asks whether background traffic
      impairs THE FLEET, and M03's maximum can be won by the background
      traffic itself -- measured, it was, on the four seeds that produced
      G6's headline failure (docs/wp9-plan.md sec24.2). Since a QoS-aware
      scheduler starves a non-GBR flood BY DESIGN, the better an arm
      contained the aggressor the worse its G6 score: the causal direction
      was inverted. M03 is UNCHANGED -- editing it would silently
      re-interpret every historical reading -- so this is an additional
      statistic and a re-pointed binding, not a redefinition. The panel is
      append-only under the same pre-registration rules; this is an
      addition, not a definition change to an existing metric.
    caveats:
      - >
        A MAX over UEs. Even restricted to protected bearers this is an
        extreme-value statistic: the winning flow changed identity between
        paired base and excursion runs on 35 of 40 seeds
        (docs/wp9-plan.md sec27.3), so a relative change tracks WHICH UE
        spiked hardest as much as whether the fleet degraded. Read it with
        Scorecard.robust_delta_summary, never as a bare mean of ratios.

  - id: M21
    name: slo_recovery_time_by_delivery
    definition: >
      Per join/re-join/re-establishment event, time from the event's
      trigger (RF-restore, for the reestablish path) to the first window
      in which the recovering UE's flows drop or deliver-late no more
      than `violation_ceiling` of their arriving bytes. M19's companion,
      judging "green" by DELIVERY instead of head-of-line age.
    guarantees: [G9, G3]
    unit: ms
    direction: lower_better
    status: ok
    requires: null
    note: >
      WP9 G9 commit 3. Added because M19 CANNOT REPORT RED:
      sim/buffer.py::expire() pops any chunk older than the PDB every
      slot, so head-of-line age is capped at pdb_ms BY CONSTRUCTION and
      M19's `hol <= pdb_ms` green test is always true. Measured on G9's
      own scenarios: 0 of 20,000 and 0 of 30,000 slots exceed PDB on any
      flow, max HoL exactly pdb_ms, while the recovering UE drops
      1,396,203 bytes of video -- M19 reads green throughout a total
      outage and reports p50 = 0.0 ms. M19's registered caveat therefore
      UNDERSTATES it: the metric does not merely risk reading a
      never-delivering flow as green, it can never read anything else.
      M19 IS LEFT UNCHANGED -- editing a pre-registered metric is what
      this file's own guard forbids, and every historical M19 reading must
      keep meaning what it meant. This is an ADDITION and a re-pointed
      binding, the same disposition M20 used for M03. On the same
      scenarios M21 reports cold-path p50 1449 ms / p95 2949 ms and
      reestablish 13.5 ms where M19 reports 0.0.
    caveats:
      - >
        The windowed ratio is byte-weighted over the recovering UE's own
        flows only. It says when that UE's delivery recovered, NOT whether
        neighbours were unaffected -- G9's fourth clause is a separate
        statistic over a separate population (docs/wp9-plan.md §31.6).

  - id: M04
    name: survival_time_failures
    definition: >
      Runs of >= N consecutive missed deadlines (TS 22.104: industrial
      applications fail on consecutive misses, not averages).
    guarantees: [G3, G11]
    unit: count
    direction: lower_better
    status: proxy
    requires: WP7 (discrete message model) for an exact per-message miss;
      record_timeseries=True for the current proxy
    note: >
      Proxy: consecutive per-slot samples where head-of-line delay exceeds
      the flow's PDB, from the opt-in per-slot timeseries. Requires
      driver.run(..., record_timeseries=True). Without it this metric is
      pending, not zero.

  - id: M05
    name: pdu_set_completeness
    definition: >
      >= 99% of frames complete within the set delay budget; partial
      frames count as failed.
    guarantees: [G5]
    unit: fraction
    direction: higher_better
    status: ok
    requires: null
    note: >
      WP7 commit 6: worst (min) per-flow fraction of frames fully delivered
      within pdb_ms, grouping sim/messages.py::FrameLedger over Message.
      frame_id (sim/scorecard.py::Scorecard._m05_pdu_set_completeness). This
      branch has no separate PDU-Set Delay Budget concept, so a frame's own
      packet PDB doubles as its set delay budget -- see that function's own
      note. A record produced before WP7 commit 6 (no frame_completions on
      any FlowRecord) reports status=pending, not a fallback proxy.

  - id: M06
    name: frame_age_at_mec
    definition: recv_ts - frame_generation_ts, p95.
    guarantees: [G5]
    unit: ms
    direction: lower_better
    status: ok
    requires: null
    note: >
      WP7 commit 6: p95 age over fully-delivered frames only (worst flow),
      same FrameLedger grouping as M05 (sim/scorecard.py::Scorecard.
      _m06_frame_age_at_mec). A flow that generated frames but completed
      none has an undefined age and is excluded here, not scored as 0ms --
      see M05 for that flow's completeness failure. Pre-WP7-commit-6
      records report status=pending.

  - id: M07
    name: gbr_contract_count
    definition: Count of GBR flows delivering >= 95% of GFBR.
    guarantees: [G10]
    unit: count
    direction: higher_better
    status: ok
    requires: null

  - id: M08
    name: worst_flow_gfbr_fraction
    definition: "min_f(delivered_f / GFBR_f) over GBR flows -- the max-min floor."
    guarantees: [G8, G10]
    unit: fraction
    direction: higher_better
    status: ok
    requires: null

  - id: M09
    name: per_second_jain_index
    definition: >
      Jain's index over per-flow delivery ratios, computed per 1s window
      (aggregate Jain over a whole run is known to mask short-timescale
      oscillation -- see docs/p5g-sim-plan.md sec 7).
    guarantees: [G8]
    unit: index [0,1]
    direction: higher_better
    status: proxy
    requires: record_timeseries=True
    note: Requires driver.run(..., record_timeseries=True); pending otherwise.

  - id: M10
    name: aggregate_throughput
    definition: Total delivered bytes (cost side of every QoS gain).
    guarantees: []
    unit: bps
    direction: neutral
    status: ok
    requires: null

  - id: M11
    name: prb_utilization
    definition: Used / available PRBs, per direction.
    guarantees: []
    unit: fraction
    direction: neutral
    status: ok
    requires: null
    note: Detects reservation holding reserved-but-unused PRBs (H1).

  - id: M12
    name: pdcch_cce_utilization
    definition: Used / budget CCEs.
    guarantees: [G10]
    unit: fraction
    direction: neutral
    status: ok
    requires: null
    note: Detects the control-plane bound (H1).

  - id: M13
    name: first_violation_order
    definition: Which 5QI class first breaches under a load ramp.
    guarantees: [G12]
    unit: ordinal (5QI sequence)
    direction: null
    status: ok
    requires: "a load-ramp study (multiple RunRecords, ascending load) -- not a single-run metric"
    note: Computed by scorecard.first_violation_order() over an ordered run sequence.

  # --- Added relative to docs/p5g-sim-plan.md sec 7, per the guarantee-test
  # --- document review (README.md sec 6). Same numbering scheme continues.

  - id: M14
    name: communication_service_availability
    definition: >
      TS 22.104: fraction of transfer intervals where the message arrived
      within (max latency + survival time).
    guarantees: [G11]
    unit: fraction
    direction: higher_better
    status: ok
    requires: null
    note: >
      WP7 commit 8: reuses M03's exact gap mechanism (completion_ts_by_
      role_s's receiver-side inter-arrival gaps) against a different
      threshold -- pdb_ms + survival_time_ms per flow, not T_live-derived
      ones (sim/scorecard.py::Scorecard._m14_communication_service_
      availability). survival_time_ms (FlowConfig, dormant at 0.0 -- this
      branch's own [OPEN], docs/wp7-plan.md Decision #3) is reported
      alongside every value: at its universal current default, CSA
      collapses exactly to "fraction of gaps within pdb_ms," not a full
      CSA measurement including the TS 22.104 grace period -- the value is
      never quotable without that context. This is the number that fills
      in G11's row on the Guarantee Sheet. Pre-WP7-commit-4 records report
      status=pending (same gate as M03).
    caveats:
      - >
        HARQ-blind until WP5 commits 4a/4b land (docs/wp5-plan.md): reuses
        M03's gap mechanism, so it inherits the same optimism -- a gap that
        would include a HARQ retry's RTT in a system with real HARQ is not
        yet modeled (README.md sec3/sec4).

  - id: M15
    name: command_jitter_p99_p50
    definition: p99 minus p50 delay (not stddev), on a command/control flow.
    guarantees: [G1, G2]
    unit: ms
    direction: lower_better
    status: ok
    requires: null
    note: WP7 -- same true-latency fields as M01; same pre-WP7 fallback.
    caveats:
      - >
        HARQ-blind until WP5 commits 4a/4b land (docs/wp5-plan.md): same
        true-latency fields as M01, so the same optimism applies -- p99 in
        particular is where a HARQ retry's RTT would land once modeled,
        so this jitter figure understates the eventual tail (README.md
        sec3/sec4).

  - id: M16
    name: ul_dl_shared_bearer_correlation
    definition: >
      Correlation between UL and DL delay/delivery series on a shared
      bearer (T1/T2), across the run's timeseries. Whether both directions
      degrade together -- a robot both blind and unresponsive at once is a
      distinct, worse failure than either alone.
    guarantees: [G1, G2, G3]
    unit: Pearson r, [-1,1]
    direction: null
    status: proxy
    requires: record_timeseries=True; caller must name the UL/DL flow pair
    note: Computed by scorecard.correlate_flows(); no automatic bearer pairing yet.

  - id: M17
    name: frame_freeze_and_effective_fps
    definition: >
      Freeze events (gaps > 2 frame intervals), count and duration; and
      effective fps at the MEC vs fps at the camera.
    guarantees: [G5]
    unit: mixed (count, ms, fps)
    direction: lower_better
    status: ok
    requires: null
    note: >
      WP7 commit 7: worst (most freeze events, ties by total duration)
      per-flow freeze count/duration plus effective (MEC) vs source fps
      (sim/scorecard.py::Scorecard._m17_frame_freeze_and_effective_fps). A
      freeze is a gap between consecutive fully-delivered frames exceeding
      2x the flow's CONFIGURED nominal frame interval (FlowRecord.
      xr_frame_period_ms) -- deliberately not this simulator's own
      slot-quantised actual firing interval, so a freeze reflects the
      source's real claimed frame rate, not a time-discretisation artifact.
      Pre-WP7-commit-7 records report status=pending.

  # --- M18/M19 are the panel's FIRST additions since WP0 pre-
  # --- registration (docs/wp-join-plan.md sec5). Not foreseeable at WP0:
  # --- WP-Join itself postdates this panel by seven prior WPs, added to
  # --- README.md sec4 only after the guarantee-document review -- there
  # --- was no G9/join/RLF mechanism anywhere in sim/ for WP0 to have
  # --- pre-registered a placeholder against (unlike M04/M09/M16, which
  # --- WERE foreseeable then and got proxy/pending placeholders at WP0).
  # --- No existing M01-M17 entry above is changed to accommodate these.
  # --- Landed at WP-Join commit 4 of 8 (schema); promoted at commits 5/6.

  - id: M18
    name: rejoin_interruption_time
    definition: >
      Per join/re-join/re-establishment event, wall-clock from the
      event's own trigger instant to procedure completion (radio
      attached AND app handshake complete), broken down by path
      (warm/cold/reestablish) and by phase. For the reestablish path,
      also reported from the RF-restore instant, which is what GT-6.3's
      own pass line is measured from -- not from RLF declaration.
    guarantees: [G9]
    unit: ms
    direction: lower_better
    status: ok
    requires: null
    note: >
      Added WP-Join commit 4 (not at WP0 -- see the comment above this
      entry); computation landed commit 4, flipped ok at commit 5 once a
      real UEConfig.join scenario can populate RunRecord.join_events at
      all. Computed directly from those timestamps, grouped by
      JoinEventRecord.path; events that never completed before the run's
      horizon are counted (n_never_completed), not excluded from the row,
      same "never silently omit" discipline as a pending metric itself.
      Every event produced by commit 5 alone reports attached_slot=None
      (100% n_never_completed) -- WP-Join commit 6's app-handshake message
      pair is what lets an event ever reach "attached"; this is a known,
      documented gap, not a bug (docs/wp-join-plan.md "Commit 5 --
      landed").

  - id: M19
    name: slo_recovery_time
    definition: >
      Per event, time from the event's trigger (RF-restore, for the
      reestablish path) to the first sustained window (defaults.
      slo_green_dwell_s) in which every flow of the recovering UE is
      back inside its own PDB. Events where SLOs never go green before
      the run ends are counted, not excluded.
    guarantees: [G9, G3]
    unit: ms
    direction: lower_better
    status: proxy
    requires: >
      WP-Join (join event log) + record_timeseries=True; an exact
      per-message SLO evaluation reusing WP7's message ledger is a
      follow-on commit, not this one
    note: >
      Added WP-Join commit 4 (not at WP0 -- see the comment above this
      entry); promoted commit 6. "green" is judged from head-of-line
      delay against each flow's own pdb_ms only, not a full GFBR
      contract check -- a deliberate simplification, not an oversight;
      stays proxy for that reason, not because the mechanism is
      incomplete. Finding, recorded rather than silently acted on: this
      metric's own computation needed nothing from commit 6 specifically
      -- for the reestablish path (app_running never drops), trigger_ts_s/
      rf_restore_ts_s plus record_timeseries=True were already sufficient
      after commit 5 alone to compute a real value. Promotion was still
      held to commit 6, deliberately, to keep it bundled with its
      originally-planned commit rather than slipping it in early --
      the exact precedent CLAUDE.md records for M04 and WP7 ("fixing M04
      exactly is close to free but was kept out of every WP7 commit on
      purpose, since bundling a refinement... into an unrelated commit's
      diff defeats the attribution the one-fidelity-change-per-commit
      rule exists for").
    caveats:
      - >
        WP-Join commit 8's own GT-6.3 acceptance demo found a sharper,
        concrete instance of the proxy gap above: sim/buffer.py's
        expire() continuously evicts the head of a queue once it turns
        pdb_ms old, so a flow being MASSIVELY PDB-violated (65% of bytes
        dropped, in the demo's own reestablish arm) can still show
        ts_hol_delay_s never exceeding pdb_ms at all -- the queue head is
        never allowed to age past the point expire() removes it, so this
        metric's "green" test reads the same as a flow with zero
        violations. Not fixed here (a distinct mechanism change, out of
        this commit's scope): a true fix needs the PDB-violation rate
        itself (M02-style), not head-of-line age alone, folded into the
        "green" definition.

# Statistical policy (docs/p5g-sim-plan.md sec 7 / sec 5.3): the rule of
# three. Demonstrating a miss rate <= eps at 95% confidence with zero
# observed misses needs n >= 3/eps samples. Every zero-miss claim produced
# from this panel must state the demonstrated bound, never a tighter one --
# this applies identically to simulated and measured results.
statistical_policy:
  rule_of_three: true
  confidence: 0.95

# Contract defaults. Override per-study; record the override in the study's
# own output, since a changed default silently changes every downstream
# guarantee-sheet row.
defaults:
  gbr_contract_fraction: 0.95   # M07 / M08: "delivering >=95% of GFBR"
  survival_miss_n: 3            # M04: [OPEN] in docs/p5g-sim-plan.md sec 7 -- start at 3, report as f(N)
  t_live_s: 2.0                 # [OPEN] in docs/p5g-sim-plan.md sec 13 -- MEC liveness timeout, unconfirmed
  slo_green_dwell_s: 1.0         # M19: [OPEN] -- anchored to M09's own 1s Jain window, not independently calibrated
