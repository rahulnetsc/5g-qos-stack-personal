# Scenario 2 — overload: a PF best-effort flow, a GBR flow, and a Delay
# flow competing under severe overload. Pair with a small-cell RAN
# (default: dsuuu_10mhz) so offered load far exceeds capacity and the
# schedulers' QoS-enforcement differences show.

name: overload
default_ran: dsuuu_10mhz

defaults:
  ue:
    mean_snr_db: 20.0
    coherence_slots: 2000

ues:
  - ue_id: 1
    flows:
      - qfi: 9
        direction: DL
        flow_class: PF
        max_delay_budget_ms: 300
        traffic: {kind: poisson, rate_bps: 20_000_000}

  - ue_id: 2
    flows:
      - qfi: 2
        direction: DL
        flow_class: GBR
        min_data_rate_bps: 4_000_000
        max_delay_budget_ms: 100
        traffic: {kind: poisson, rate_bps: 4_000_000}

  - ue_id: 3
    flows:
      - qfi: 1
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 20
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 400}
