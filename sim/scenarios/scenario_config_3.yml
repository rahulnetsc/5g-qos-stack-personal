# Scenario 3 — vision: three 30 fps cameras + best-effort upload. The
# cameras' average bandwidth fits the carrier, but their I-frame bursts
# stress a non-SPS scheduler's tail latency. I-frame phases are staggered
# (0/10/20 of 30) so the bursts don't all land in the same slot.

name: vision
default_ran: dsuuu_30mhz

defaults:
  ue:
    mean_snr_db: 22.0
    coherence_slots: 2000

ues:
  - ue_id: 1
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 6_500_000
        max_delay_budget_ms: 30
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 25_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
          i_frame_phase: 0

  - ue_id: 2
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 6_500_000
        max_delay_budget_ms: 30
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 25_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
          i_frame_phase: 10

  - ue_id: 3
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 6_500_000
        max_delay_budget_ms: 30
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 25_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
          i_frame_phase: 20

  - ue_id: 4
    flows:
      - qfi: 9
        direction: UL
        flow_class: PF
        max_delay_budget_ms: 300
        traffic: {kind: poisson, rate_bps: 5_000_000}
