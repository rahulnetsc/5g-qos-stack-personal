# RAN config: 30 MHz, numerology 1, balanced DSUUU TDD.
# A mid-band cell with an even DL/UL split — the default radio for the
# smoke, vision, and sensor-dense workloads.

carrier:
  bandwidth_mhz: 30
  numerology: 1         # SCS = 15 * 2^mu kHz; slot = 1 / 2^mu ms -> 0.5 ms
  overhead_factor: 0.85

tdd:
  pattern: DSUUU        # D=DL, U=UL, S=special
  s_slot_split: {dl_symbols: 3, gap_symbols: 2, ul_symbols: 9}
