# Factory-robots scenario: 10 robots on a private 5G cell (the main study
# scenario; was the configs/ YAML pair before the scenarios refactor).
#
# Each robot uploads video / sensor data to an edge server (UL-heavy GBR)
# and receives control-loop commands (DL low-rate, tight delay). Three
# robots also do best-effort UL uploads (logs / backups) -- the sacrificable
# load that scheduler comparison exercises. UE 10 is an asymmetric TCP
# example: a bidirectional app modelled as two flow entries with different
# QFIs (each flow is uni-directional by design, matching 3GPP).
#
# Aggregate offered load against the radio below (40 MHz, numerology 2,
# DSUUU + S-slot 3:2:9):
#   - UL capacity (~peak): ~112 Mbps; UL offered: ~110 Mbps  -> ~98% UL load
#   - DL capacity (~peak): ~37 Mbps;  DL offered:  ~11 Mbps  -> ~30% DL load
# UL is in the overload regime -- the pressure that exposes TwoTier's GBR
# protection vs PF's equal-share behaviour on best-effort flows.

name: factory_robots

simulation:
  horizon_slots: 4000   # at numerology 2 (0.25 ms slot) this is 1.0 s
  seed: 42

carrier:
  bandwidth_mhz: 40
  numerology: 2         # SCS = 15 * 2^mu kHz; slot = 1 / 2^mu ms
  overhead_factor: 0.85

tdd:
  pattern: DSUUU
  s_slot_split: {dl_symbols: 3, gap_symbols: 2, ul_symbols: 9}

defaults:
  ue:
    mean_snr_db: 20.0
    coherence_slots: 2000
  flow:
    # `direction` is intentionally NOT defaulted -- every flow declares
    # UL or DL explicitly so the workload is unambiguous at a glance.
    flow_class: PF
    min_data_rate_bps: 0          # GFBR -- guaranteed floor (0 = best effort)
    max_data_rate_bps: 2_000_000  # MFBR -- upper cap (not enforced in sim)
    max_delay_budget_ms: 30       # PDB

ues:
  # ---- HD-camera robots (UE 1-4): 8 Mbps UL video + DL control loop ----
  - ue_id: 1
    mean_snr_db: 22.0
    flows:
      - qfi: 2                    # UL: H.264 camera stream
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 8_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 33_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
      - qfi: 82                   # DL: control commands (deterministic, tight)
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  - ue_id: 2
    mean_snr_db: 18.0
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 8_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 33_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
      - qfi: 82
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  - ue_id: 3
    mean_snr_db: 20.0
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 8_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 33_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
      - qfi: 82
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  - ue_id: 4
    mean_snr_db: 16.0
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 8_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 33_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
      - qfi: 82
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  # ---- LIDAR+camera robots (UE 5-7): 14 Mbps UL combined + DL control ----
  - ue_id: 5
    mean_snr_db: 24.0
    flows:
      - qfi: 2                    # UL: LIDAR + camera combined stream
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 14_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 58_000
          i_frame_multiplier: 3.0
          i_frame_period_in_frames: 30
      - qfi: 82
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  - ue_id: 6
    mean_snr_db: 19.0
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 14_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 58_000
          i_frame_multiplier: 3.0
          i_frame_period_in_frames: 30
      - qfi: 82
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  - ue_id: 7
    mean_snr_db: 14.0           # further from gNodeB, AL=2 PDCCH cost
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 14_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 58_000
          i_frame_multiplier: 3.0
          i_frame_period_in_frames: 30
      - qfi: 82
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  # ---- Best-effort UL load on three of the camera robots (UE 8-10) ----
  # These model on-robot logs / recordings / software updates uploaded
  # opportunistically. They share the UL pipe with the GBR video above and
  # are what TwoTier should sacrifice under overload.
  - ue_id: 8
    mean_snr_db: 21.0
    flows:
      - qfi: 2                    # UL: HD camera (lower bitrate)
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 6_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 25_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
      - qfi: 9                    # UL: best-effort log / backup upload
        direction: UL
        flow_class: PF
        max_delay_budget_ms: 300
        traffic: {kind: poisson, rate_bps: 10_000_000}
      - qfi: 82                   # DL: control loop
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  - ue_id: 9
    mean_snr_db: 17.0
    flows:
      - qfi: 2
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 6_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 25_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
      - qfi: 9
        direction: UL
        flow_class: PF
        max_delay_budget_ms: 300
        traffic: {kind: poisson, rate_bps: 10_000_000}
      - qfi: 82
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}

  # ---- Robot 10: asymmetric TCP example ----
  # Uploads camera (UL GBR) AND downloads a large dataset / firmware over
  # TCP (DL bulk + UL acks) -- the canonical bidirectional-app pattern:
  # two flow entries, different QFIs, rates in their respective directions.
  - ue_id: 10
    mean_snr_db: 20.0
    flows:
      - qfi: 2                    # UL: camera stream (the "robot work")
        direction: UL
        flow_class: GBR
        min_data_rate_bps: 6_000_000
        traffic:
          kind: video_frame
          period_ms: 33.33
          avg_bytes: 25_000
          i_frame_multiplier: 4.0
          i_frame_period_in_frames: 30
      - qfi: 9                    # DL: TCP bulk download (firmware / dataset)
        direction: DL
        flow_class: PF
        max_delay_budget_ms: 300
        traffic: {kind: poisson, rate_bps: 10_000_000}
      - qfi: 8                    # UL: TCP acks (~3% of DL bulk rate)
        direction: UL
        flow_class: PF
        max_delay_budget_ms: 300
        traffic: {kind: poisson, rate_bps: 300_000}
      - qfi: 82                   # DL: control loop
        direction: DL
        flow_class: Delay
        max_delay_budget_ms: 10
        traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 40}
