# Scenario 4 — sensor_dense: 30 small periodic UL sensor flows.
#
# Each sensor: 5 ms reporting period, 200 bytes (~320 kbps), 15 ms PDB.
# Total offered (~10 Mbps) is well under PRB capacity — the binding
# constraint is the per-slot PDCCH/CCE budget for dynamic grants. SNR 12 dB
# puts every sensor at DCI aggregation level 2, which makes PDCCH bind and
# lets SPS / Configured Grants (no per-slot DCI) shine.

name: sensor_dense
default_ran: dsuuu_30mhz

defaults:
  ue:
    mean_snr_db: 12.0
    coherence_slots: 2000
  flow:
    qfi: 1
    direction: UL
    flow_class: Delay
    max_delay_budget_ms: 15
    traffic: {kind: deterministic, period_ms: 5.0, bytes_per_period: 200}

ues:
  - {ue_id: 1,  flows: [{}]}
  - {ue_id: 2,  flows: [{}]}
  - {ue_id: 3,  flows: [{}]}
  - {ue_id: 4,  flows: [{}]}
