# scheduler-config.yaml
#
# Reference / default configuration for the two-tier scheduler
# (`scheduler.TwoTier`). Every value here is the shipped default; a host
# (the sim, or an OAI adapter) can override any subset.
#
# Loading: `scheduler.load_two_tier_config(path)` returns a dict suitable
# for `TwoTier(**cfg)`. See `scheduler/HOWTO.md` for the OAI integration
# path.
#
# Naming discipline: keys here must match `TwoTier.__init__` kwargs
# one-to-one. There is no nesting; the visual grouping via comments is
# for humans only. `load_two_tier_config` validates every key against the
# constructor signature and rejects unknowns.
#
# Phase 2 (docs/phase2-plan.md): TwoTier's rewrite is COMPLETE as of
# two-tier commit 9 -- this file's own final state, not a mid-port
# snapshot. The constructor takes exactly ONE kwarg, `min_rb` (below,
# added commit 4); commit 1 deleted every other knob (SPS entirely, the
# whole pre-Phase-2 Tier-1 apparatus) and none of them came back. The
# section headers below name the commit that landed each mechanism and
# record, as a settled fact rather than a provisional one, that four of
# the five landed WITHOUT any configurable surface -- every constant
# they need is ground-truth-derived (a C macro, a spec table, or a value
# derived at configure() time from the grid), so exposing it as a knob
# would invite overriding it away from what the deployed scheduler
# actually runs. Two mechanisms are permanently gone, not merely
# unconfigured -- the max-min GBR stage and the adaptive dual-ascent
# penalty (no citation in docs/phase2-plan.md sec2.1's ground truth;
# already a documented negative result, design-docs/scheduler-study.md
# sec8.4; see README.md sec7).
#
# ─── Tier-1 (SCA/GLPK, 0.1s cadence) -- commit 2 ─────────────────────────
# No keys. The period is derived at configure() time from
# _TIER1_PERIOD_S=0.1 (ia_p5g_scheduler.c:74-76, the deployed macro)
# divided by the grid's own slot_duration_s -- numerology-robust by
# construction, and deliberately NOT a knob: the pre-Phase-2 file's own
# tier1_period_slots=2000 default encoded a stale header comment's
# "1.0 s" rather than the real 0.1 s (CLAUDE.md's own invariant).
#
# ─── Tier-2 windowed-ceiling VQ -- commit 3a ─────────────────────────────
# No keys. Every constant (the DL arrival-delta ceiling, UL's own
# backlog/catchup form, _VQ_UL_CATCHUP_N=5) is read directly from
# ia_p5g_scheduler.c.
#
# ─── UL floor (fruitless-shift / ADQ) -- commit 4 ────────────────────────
# min_rb: mac->min_grant_prb (ia_p5g_scheduler.c:2210) -- the SAME
# deployment-configured field reservation.py's own follower budget
# reads (CLAUDE.md's own invariant); the UL floor's ADQ crumb-run
# detector depends on it too. Default 5 matches the calibration
# campaign's own deployed value.
min_rb: 5
#
# ─── DL LCP fill + post-grant deficit drain -- commit 5 ──────────────────
# No keys. The fill order is (priority ASC, vq_dl DESC), both terms
# derived from already-configured FlowConfig/VQ state.
#
# ─── MCS selection / OLLA -- commit 6 ────────────────────────────────────
# No keys. _OLLA_OFFSET is pinned at 0 -- provably, not by default: the
# ratchet's own trigger (rounds[0]/[1]) is structurally unobservable to
# any scheduler here, since WP5 Decision 4 routes retry grants entirely
# through sim/driver.py's HARQ seam. Exposing an offset knob would let a
# host configure a value the deployed scheduler cannot produce.
# reservation.py carries the identical disposition, so a two-tier-vs-
# reservation comparison measures scheduling policy, not link adaptation.
#
# ─── reset_ue / SchedulerContextReset -- commit 7 ────────────────────────
# No keys. Scope semantics ("mac" vs "full") come from the caller
# (sim/driver.py's own join/RLF-recovery edge), not from config.
#
# ─── SPS / Configured Grants -- permanently removed ──────────────────────
# Confirmed absent from OAI C entirely (docs/phase2-plan.md sec2.1);
# `_SPSReservation`/`_allocate_sps`/`enable_sps`/`sps_*` existed only in
# the pre-Phase-2 Python (tag phase2-pre-twotier-rewrite, dc1ab6a).
#
# ─── Max-min GBR stage / adaptive dual-ascent penalty -- permanently
#     removed ─────────────────────────────────────────────────────────────
# `gbr_maxmin`/`gbr_maxmin_scale`/`gbr_penalty_lr`/`gbr_penalty_se_exponent`
# had no citation in docs/phase2-plan.md sec2.1's Tier-1 ground truth
# (a *fixed*-constant soft-slack penalty only) and were already a
# documented negative result (design-docs/scheduler-study.md sec8.4).
# Their pre-removal comparison is preserved as a one-time snapshot in
# docs/phase2-two-tier-delta.md sec1.
